# =============================================================================
# synthea.properties — EUROPEAN CALIBRATION
# =============================================================================
# Audit performed against WHO Europe / Eurostat / ESC / ESMO reference data.
# Changes from the US default are marked with:
#   [EU-CHANGE]  — actively modified for European use
#   [EU-NOTE]    — left as-is but reason explained
#   [EU-TODO]    — requires a separate file you still need to create/supply
# =============================================================================

# -----------------------------------------------------------------------------
# EXPORTER SETTINGS
# -----------------------------------------------------------------------------

exporter.baseDirectory = ./output/
exporter.use_uuid_filenames = false
exporter.subfolders_by_id_substring = false
exporter.pretty_print = true

# [EU-CHANGE] Increased from 10 to 0 (full lifetime history).
# European chronic disease research requires full patient histories:
# hypertension onset at 35 still visible at age 70. With years_of_history=10
# you lose the entire onset record for any condition diagnosed >10 years ago,
# making prevalence calculations on the conditions.csv meaningless.
# Set back to 10 only if output file size is a constraint.
exporter.years_of_history = 0

exporter.split_records = false
exporter.split_records.duplicate_data = false
exporter.metadata.export = true
exporter.ccda.export = false

# [EU-CHANGE] Disabled FHIR R4 export by default.
# If you DO need FHIR, see exporter.fhir.use_us_core_ig below first.
# Keeping csv.export = true as primary output for European research pipelines.
exporter.fhir.export = false
exporter.fhir_stu3.export = false
exporter.fhir_dstu2.export = false

exporter.fhir.use_shr_extensions = false

# [EU-CHANGE] CRITICAL — was: true. Must be FALSE for non-US FHIR output.
# us_core_ig = true embeds hard US-specific profile constraints into every
# FHIR resource (us-core-patient, us-core-race-extension using US OMB race
# codes, etc.). European FHIR implementations use IHE profiles or national
# IGs (HL7 EU Base, SNOMED NL/DE/FR, etc.), none of which are US Core.
# Leaving this true produces FHIR resources that are technically invalid
# outside US Core validators.
exporter.fhir.use_us_core_ig = false

# [EU-NOTE] us_core_version is ignored when use_us_core_ig = false.
# Left here for reference; no action needed.
exporter.fhir.us_core_version = 6.1.0

exporter.fhir.transaction_bundle = false
exporter.fhir.bulk_data = false
exporter.fhir.included_resources =
exporter.fhir.excluded_resources =
exporter.groups.fhir.export = false
exporter.hospital.fhir.export = false
exporter.hospital.fhir_stu3.export = false
exporter.hospital.fhir_dstu2.export = false
exporter.practitioner.fhir.export = true
exporter.practitioner.fhir_stu3.export = false
exporter.practitioner.fhir_dstu2.export = false

# [EU-NOTE] UTF-8 is correct and essential. European names contain diacritics
# (Björn, Müller, Ångström, José, Łódź). Do not change this.
exporter.encoding = UTF-8

exporter.json.export = false
exporter.json.include_module_history = false

exporter.csv.export = true
exporter.csv.append_mode = false
exporter.csv.folder_per_run = false
exporter.csv.included_files =
exporter.csv.excluded_files = patient_expenses.csv
exporter.csv.max_lines_per_file =
exporter.csv.file_number_digits =

exporter.cpcds.export = false
exporter.cpcds.append_mode = false
exporter.cpcds.folder_per_run = false
exporter.cpcds.single_payer = false

# [EU-NOTE] BFD (Medicare Beneficiary) export — US-only. Leave disabled.
exporter.bfd.export = false
exporter.bfd.require_code_maps = true
exporter.bfd.export_missing_codes = true
exporter.bfd.bene_id_start = -1000000
exporter.bfd.clm_id_start = -100000000
exporter.bfd.clm_grp_id_start = -100000000
exporter.bfd.pde_id_start = -100000000
exporter.bfd.fi_doc_cntl_num_start = -100000000
exporter.bfd.carr_clm_cntl_num_start = -100000000
exporter.bfd.mbi_start = 1S00-E00-AA00
exporter.bfd.hicn_start = T01000000A
exporter.bfd.partc_contract_start = Y0001
exporter.bfd.partc_contract_count = 10
exporter.bfd.plan_benefit_package_start = 800
exporter.bfd.plan_benefit_package_count = 5
exporter.bfd.partd_contract_start = Z0001
exporter.bfd.partd_contract_count = 10
exporter.bfd.clia_labs_start = 00A0000000
exporter.bfd.clia_labs_count = 10
exporter.bfd.cutoff_date=20140529

exporter.cdw.export = false
exporter.text.export = false
exporter.text.per_encounter_export = false
exporter.clinical_note.export = false

exporter.symptoms.csv.export = false
exporter.symptoms.mode = 0
exporter.symptoms.csv.append_mode = false
exporter.symptoms.csv.folder_per_run = false
exporter.symptoms.text.export = false

exporter.enable_custom_exporters = true

# -----------------------------------------------------------------------------
# GENERATION — POPULATION
# -----------------------------------------------------------------------------

generate.default_population = 1
generate.thread_pool_size = -1
generate.log_patients.detail = simple
generate.timestep = 604800000

# -----------------------------------------------------------------------------
# GENERATION — GEOGRAPHY (ALL EU-CHANGED)
# -----------------------------------------------------------------------------

# [EU-CHANGE] CRITICAL — was NOT SET (defaulting to US Census file).
# This is the single most important setting. Without this, all age/sex
# distributions are US-based regardless of your other European files.
# Source: Eurostat EHIS 2022 / population structure data.
generate.demographics.default_file = geography/demographics_europe.csv

# [EU-CHANGE] European postal codes — 379 cities across 13 countries.
generate.geography.zipcodes.default_file = geography/zipcodes_europe.csv

# [EU-CHANGE] was: US. NOTE: "EU" is not a valid ISO 3166-1 alpha-2 code.
# Synthea uses this string literally in patient address fields and FHIR
# records. Options:
#   - Use a specific country: NL, DE, FR, IT, ES, PL, BE, SE, NO, DK, AT, CH, PT
#   - Use "EU" as a custom label (Synthea won't reject it, but FHIR
#     validators may flag the country code in Address.country)
# For a clean pan-European FHIR dataset, post-process country codes per
# patient using their assigned region, or run separate simulations per country.
generate.geography.country_code = EU

# [EU-CHANGE] 173 European regions → CET/WET/AZOT timezones.
generate.geography.timezones.default_file = geography/timezones_europe.csv

# [EU-CHANGE] Eurostat 2022 migration patterns, 161 regions, 103 origin countries.
generate.geography.foreign.birthplace.default_file = geography/foreign_birthplace_europe.json

# [EU-CHANGE] EU-SILC / WHO Europe SDOH indicators by region.
generate.geography.sdoh.default_file = geography/sdoh_europe.csv

# [EU-CHANGE] was: http://hl7.org/fhir/sid/passport-USA
# Using generic EU travel document URI for pan-European datasets.
# For single-country: http://hl7.org/fhir/sid/passport-NLD (etc.)
generate.geography.passport_uri = http://hl7.org/fhir/sid/eu-travel-document

# -----------------------------------------------------------------------------
# GENERATION — SOCIOECONOMIC MODEL
# -----------------------------------------------------------------------------

generate.lookup_tables = modules/lookup_tables/
generate.max_attempts_to_keep_patient = 1000
generate.only_dead_patients = false
generate.only_alive_patients = false
generate.track_detailed_transition_metrics = false
generate.append_numbers_to_person_names = true
generate.middle_names = 0.80
generate.veteran_population_override = false

# [EU-NOTE] These weights control how income, education and occupation
# are combined into a socioeconomic score. The weights themselves are
# dimensionless and the European social gradient in health research
# (Mackenbach et al.) broadly supports education as the strongest predictor.
# The current weighting (income 0.2, education 0.7, occupation 0.1) is
# reasonable for Europe. No change needed.
generate.demographics.socioeconomic.weights.income = 0.2
generate.demographics.socioeconomic.weights.education = 0.7
generate.demographics.socioeconomic.weights.occupation = 0.1

generate.demographics.socioeconomic.score.low = 0.0
generate.demographics.socioeconomic.score.middle = 0.25
generate.demographics.socioeconomic.score.high = 0.66

# [EU-NOTE] These thresholds map education level to socioeconomic score
# ranges. The ranges themselves are relative, not absolute, so they are
# country-agnostic. No change needed.
generate.demographics.socioeconomic.education.less_than_hs.min = 0.0
generate.demographics.socioeconomic.education.less_than_hs.max = 0.5
generate.demographics.socioeconomic.education.hs_degree.min = 0.1
generate.demographics.socioeconomic.education.hs_degree.max = 0.75
generate.demographics.socioeconomic.education.some_college.min = 0.3
generate.demographics.socioeconomic.education.some_college.max = 0.85
generate.demographics.socioeconomic.education.bs_degree.min = 0.5
generate.demographics.socioeconomic.education.bs_degree.max = 1.0

# [EU-CHANGE] was: poverty=17550, high=75000 (US Federal Poverty Level in USD)
# Replaced with Eurostat EU-SILC 2022 equivalents in EUR:
#   Poverty threshold (EU at-risk-of-poverty): ~13,000 EUR/year
#     (60% of median equivalised income for EU-27 average household)
#   High income threshold: ~45,000 EUR/year
#     (approximate 80th percentile household income, EU-27, Eurostat ilc_di01)
# Note: these thresholds drive which patients qualify for "low income"
# insurance pathways. Since EU has universal coverage, exact values matter
# less here than in the US model, but they affect SDOH module branching.
generate.demographics.socioeconomic.income.poverty = 13000
generate.demographics.socioeconomic.income.high = 45000

# [EU-NOTE] Birth weights file. WHO growth charts are globally applicable.
# The default birthweights.csv is based on CDC data but is close enough to
# WHO child growth standards for European use. Only replace if you need
# country-specific very-low-birthweight rates (e.g. for neonatal research).
generate.birthweights.default_file = birthweights.csv
generate.birthweights.logging = false

# -----------------------------------------------------------------------------
# INSURANCE / PAYER MODEL
# [EU-CHANGE] Entire section reconfigured for universal coverage model
# -----------------------------------------------------------------------------

# [EU-CHANGE] was: 2006 (Massachusetts individual mandate)
# For European universal healthcare systems, the "mandate" effectively
# started decades ago. Set to 1950 so that every simulated patient from
# birth is covered by the national health service from the earliest
# simulated date. Alternatively, set to 1 to make it effectively always
# active.
generate.insurance.mandate.year = 1950

# [EU-CHANGE] was: 0.2 (US occupational threshold for employer insurance)
# In European universal coverage models, occupation score threshold for
# mandatory coverage is irrelevant — set to 0.0 so all patients qualify
# regardless of occupation.
generate.insurance.mandate.occupation = 0.0

# [EU-CHANGE] was: 0.83 (US employer covers 83% of premium)
# In European social insurance / NHS-type systems, employer contributions
# are either via payroll tax (invisible to the patient) or the entire
# system is tax-funded. Setting to 1.0 means the "employer" (i.e. the
# state/insurer) covers 100% of costs, which best models universal systems
# like NHS (UK), SNS (Portugal/Spain), INAMI (Belgium), etc.
# For contributory systems (Germany GKV, Netherlands ZVW), use 0.85-0.90.
generate.insurance.employer_coverage = 1.0

# [EU-CHANGE] CRITICAL — was: payers/insurance_companies.csv (US companies).
# [EU-TODO] You need to create a European payers CSV.
# Minimal working European payer file structure:
#   ,id,name,address,city,state_headquartered,zip,phone,
#   states_covered,services_covered,deductible,default_coinsurance,
#   default_copay,monthly_premium,ownership
#
# Example row for Netherlands (ZVW):
#   0,EU0001,Zorgverzekering (ZVW),Postbus 1,Utrecht,Utrecht,3500,+31000000000,
#   *,*,385,0.0,0,0,Government
#
# Example row for NHS-type system:
#   0,EU0001,National Health Service,Richmond House,London,Greater London,SW1A 2NS,
#   111,*,*,0,0.0,0,0,Government
#
# Until you create this file, Synthea will fall back to the built-in US
# payer list and patients will be assigned to Medicare/Medicaid/Aetna etc.
# See: synthea/src/main/resources/payers/insurance_companies.csv for format.
generate.payers.insurance_companies.default_file = payers/insurance_companies_europe.csv
generate.payers.insurance_plans.default_file = payers/insurance_plans_europe.csv
generate.payers.insurance_plans.eligibilities_file = payers/insurance_eligibilities_europe.csv

# [EU-CHANGE] was: Medicare / Medicaid / Dual Eligible
# These names appear in the PAYER column of medications.csv and encounters.csv.
# In European systems, the equivalent is the national health service or
# statutory insurer. Patients with low income who would have been on Medicaid
# in the US model will now be assigned to this payer.
# Adjust to your target country's system name:
#   NHS (UK), ZVW (Netherlands), GKV (Germany), CPAM (France),
#   SSN (Italy/Spain), NFZ (Poland), INAMI (Belgium), SNS (Portugal)
generate.payers.insurance_companies.medicare = National Health Service
generate.payers.insurance_companies.medicaid = National Health Service
generate.payers.insurance_companies.dual_eligible = National Health Service

generate.payers.insurance_plans.income_premium_ratio = 0.034

# [EU-CHANGE] was: priority
# In universal coverage systems there is no meaningful priority-based plan
# selection — all patients use the same public insurer. "random" most
# accurately models a system where plan choice is minimal or nonexistent.
# If you build multiple regional insurers into your payer file, use
# "nearest" to assign by geography.
generate.payers.selection_behavior = random

generate.payers.adjustment_behavior = none
generate.payers.adjustment_rate = 0.10
generate.payers.loss_of_care = false

# -----------------------------------------------------------------------------
# COSTS
# [EU-CHANGE] All costs recalibrated to European healthcare pricing in EUR
# Sources: Eurostat health expenditure data; DRG price lists; OECD Health 2022
# -----------------------------------------------------------------------------

# [EU-CHANGE] was: 500.00 USD
# European procedure costs vary by country and DRG classification.
# Reference: OECD Health at a Glance 2022; Eurostat hlth_sha11_hf
# Average outpatient procedure: ~180-350 EUR (EU-27 average)
# Using 250 EUR as representative default.
generate.costs.default_procedure_cost = 250.00

# [EU-CHANGE] was: 255.00 USD — this is the single most distorted value.
# US drug pricing is 3-8x higher than European reference prices.
# European reference: WHO/OECD 2022 pharmaceutical spending per capita
# divided by average prescription count → ~35-65 EUR per dispensing.
# Using 50 EUR as representative European default.
generate.costs.default_medication_cost = 50.00

# [EU-CHANGE] was: 125.00 USD
# European GP visit: typically 0-30 EUR copay (universal systems) or
# 25-80 EUR (contributory systems). Statutory copay varies:
#   Netherlands: ~0 EUR (within deductible), Germany: ~10 EUR
#   France: ~25 EUR, Italy: ~10-36 EUR, Spain: ~0 EUR (public)
# Using 20.00 EUR as conservative pan-European average.
generate.costs.default_encounter_cost = 20.00

# [EU-CHANGE] was: 136.00 USD (US private vaccine market pricing).
# In European national immunisation programmes (NIPs), childhood vaccines
# are FREE. Adult influenza/pneumococcal vaccines are typically free or
# heavily subsidised. Setting to 0.00 EUR reflects the public programme
# model. Only change if modelling private travel vaccine clinics.
generate.costs.default_immunization_cost = 0.00

# [EU-CHANGE] was: 100.00 USD
# European laboratory costs per test (statutory reimbursement):
#   Full blood count: ~8-15 EUR, HbA1c: ~10-20 EUR, lipid panel: ~12-25 EUR
# Using 15.00 EUR as representative default.
generate.costs.default_lab_cost = 15.00

generate.costs.default_device_cost = 0.00
generate.costs.default_supply_cost = 0.00
generate.costs.method = exponential

# -----------------------------------------------------------------------------
# PROVIDERS
# [EU-TODO] All provider CSV files point to US locations — these MUST be
# replaced for geographically accurate European output. Synthea uses
# provider LAT/LON to match patients to nearby facilities.
# Without European provider files, patients are assigned to US hospitals
# regardless of your European zipcodes/demographics settings.
#
# Minimum viable replacement: hospitals.csv + primary_care_facilities.csv
# Format documented at: https://github.com/synthetichealth/synthea/wiki/Provider-Data
#
# Quick start — create a minimal hospitals.csv with real EU hospital coords:
#   ,id,name,address,city,state,zip,county,phone,type,ownership,
#   emergency,quality,LAT,LON
#
# The synthea-international GitHub repo has partial European provider files:
#   https://github.com/synthetichealth/synthea-international
# -----------------------------------------------------------------------------

generate.providers.hospitals.default_file = providers/hospitals_europe.csv
generate.providers.longterm.default_file = providers/longterm_europe.csv
generate.providers.nursing.default_file = providers/nursing_europe.csv
generate.providers.rehab.default_file = providers/rehab_europe.csv
generate.providers.hospice.default_file = providers/hospice_europe.csv
generate.providers.dialysis.default_file = providers/dialysis_europe.csv
generate.providers.homehealth.default_file = providers/home_health_europe.csv
generate.providers.urgentcare.default_file = providers/urgent_care_europe.csv
generate.providers.primarycare.default_file = providers/primary_care_europe.csv

generate.providers.veterans.default_file = providers/va_facilities.csv

generate.providers.selection_behavior = nearest
generate.providers.default_to_hospital_on_failure = true
generate.providers.minimum = 1
generate.providers.maximum_search_distance = 1000

# -----------------------------------------------------------------------------
# LIFECYCLE — minor European calibration adjustments
# -----------------------------------------------------------------------------

# [EU-CHANGE] was: 0.01
# European smoking cessation rates are slightly higher than US average,
# supported by stronger public health campaigns and reimbursed NRT/varenicline.
# Source: Eurobarometer Tobacco surveys; ECDC tobacco control indicators.
lifecycle.quit_smoking.baseline = 0.015
lifecycle.quit_smoking.timestep_delta = -0.01
lifecycle.quit_smoking.smoking_duration_factor_per_year = 1.0

# [EU-CHANGE] was: 0.001
# European alcohol treatment programmes (acamprosate/naltrexone, Alcoholics
# Anonymous coverage) show slightly higher recovery rates in EMCDDA data.
lifecycle.quit_alcoholism.baseline = 0.0015
lifecycle.quit_alcoholism.timestep_delta = -0.001
lifecycle.quit_alcoholism.alcoholism_duration_factor_per_year = 1.0

# [EU-CHANGE] was: 0.05
# Medication adherence is somewhat higher in European healthcare systems due
# to universal coverage removing cost barriers. Studies from Netherlands,
# Germany, and Scandinavia show ~70-80% adherence vs ~50-60% in US.
# Synthea's adherence baseline affects how often patients follow
# prescriptions. Raising from 0.05 to 0.08.
# Source: OECD Pharmaceutical Indicators 2022; Vrijens et al. Lancet 2012.
lifecycle.adherence.baseline = 0.08

lifecycle.death_by_natural_causes = false
lifecycle.death_by_loss_of_care = false

# -----------------------------------------------------------------------------
# PHYSIOLOGY (unchanged — country-neutral)
# -----------------------------------------------------------------------------
physiology.generators.enabled = false
physiology.state.enabled = false
growtherrors = false

# Reduce cardiovascular event generation to EU rates
# EU 10-year ASCVD event rate is ~30% lower than US
generate.cardiovascular.coronary_heart_disease.enabled=false
# Deceased patients ARE exported (see generate.only_alive_patients = false above,
# which is now the single definition of this key).
#
# This key used to be defined a second time here as "true", overriding the value
# above, because Java Properties takes the last definition. That duplicate has
# been removed - it was a trap, and it was costly:
#
# Measured 2026-08-29, Nordrhein-Westfalen, 6000 patients, seed 42, identical
# otherwise. Excluding deceased patients costs almost nothing overall (median
# absolute deviation 15% -> 14%) but destroys one row:
#
#     heart failure    +10%  ->  -89%   (2.42% -> 0.24% period prevalence)
#
# Synthea re-rolls any patient who dies, so a person who would have developed
# heart failure at 70 and died at 78 is replaced by someone who did not. That is
# survivor bias in the LIVING cohort, not merely an omission of the dead, and it
# hits the highest-mortality conditions hardest.
#
# Consumers that need living patients only (European Patient Summary, Hospital
# Discharge Report, laboratory reports, medication) should filter on an empty
# DEATHDATE in patients.csv rather than have the generator discard them, so that
# the cohort stays unbiased for every other use case.
